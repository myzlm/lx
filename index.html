<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>墨韵 · 连线</title>
<style>
/* ============================================================
   根基 · 墨色与鎏金
   ============================================================ */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink-0:#0a0806; --ink-1:#100d0a; --ink-2:#17130f;
  --ink-3:#1f1a15; --ink-4:#2a2320; --ink-5:#3a3128;
  --gold:#c9a961; --gold-2:#e8d5a0; --gold-3:#8a7440; --gold-4:#5c4d2a;
  --cinnabar:#9e2b25; --cinnabar-2:#c1392b;
  --paper:#e6dcc4; --paper-2:#b8ab90; --paper-3:#7d735f;
  --ok:#7fa86b; --err:#b84a3f;
  --font-serif:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","SimSun",serif;
  --font-kai:"KaiTi","STKaiti","Kaiti SC","楷体",var(--font-serif);
}
html,body{height:100%}
body{
  background:var(--ink-0); color:var(--paper);
  font-family:var(--font-serif); font-size:14px; line-height:1.7;
  display:flex; flex-direction:column; overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(ellipse 65% 55% at 12% -5%, rgba(201,169,97,.07), transparent 62%),
    radial-gradient(ellipse 55% 55% at 92% 105%, rgba(158,43,37,.055), transparent 62%),
    radial-gradient(ellipse 40% 40% at 50% 50%, rgba(201,169,97,.02), transparent 70%);
}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--ink-5);border-radius:0}
::-webkit-scrollbar-thumb:hover{background:var(--gold-4)}

/* ============================================================
   顶栏
   ============================================================ */
.topbar{
  position:relative; z-index:5; flex:none;
  height:66px; display:flex; align-items:center; gap:14px;
  padding:0 22px;
  background:linear-gradient(180deg,var(--ink-2),var(--ink-1));
  border-bottom:1px solid var(--gold-4);
  box-shadow:0 1px 0 rgba(201,169,97,.13), 0 8px 28px rgba(0,0,0,.55);
}
.topbar::after{
  content:''; position:absolute; left:0; right:0; bottom:3px; height:1px;
  background:linear-gradient(90deg,transparent,var(--gold-4) 18%,var(--gold-4) 82%,transparent);
  opacity:.55;
}
.seal-badge{
  width:40px; height:40px; flex:none; display:grid; place-items:center;
  background:linear-gradient(140deg,var(--cinnabar-2),var(--cinnabar));
  color:#f7ecdc; font-family:var(--font-kai); font-size:23px; font-weight:700;
  line-height:1; padding-bottom:3px; border-radius:3px;
  box-shadow:
    0 0 0 1px rgba(201,169,97,.45),
    0 0 14px rgba(158,43,37,.4),
    inset 0 0 10px rgba(0,0,0,.35);
}
.brand{display:flex; flex-direction:column; justify-content:center; line-height:1.15}
.brand h1{
  font-family:var(--font-kai); font-size:22px; font-weight:400;
  letter-spacing:.24em; color:var(--gold-2);
  text-shadow:0 0 18px rgba(201,169,97,.4);
}
.brand .tagline{
  font-size:10px; color:var(--paper-3); letter-spacing:.42em; margin-top:3px;
  font-family:var(--font-kai);
}
.spacer{flex:1}
.status-pill{
  display:flex; align-items:center; gap:8px;
  font-size:12px; color:var(--paper-2); letter-spacing:.08em;
  padding:5px 13px; border:1px solid var(--ink-5); border-radius:2px;
  background:rgba(0,0,0,.3);
}
.dot{
  width:6px; height:6px; border-radius:50%; flex:none;
  background:var(--err); box-shadow:0 0 7px currentColor; transition:.35s;
}
.dot.on{background:var(--ok); box-shadow:0 0 9px var(--ok)}
.user-pill{
  font-family:var(--font-kai); font-size:13px; color:var(--gold-3);
  letter-spacing:.14em; padding:5px 14px;
  border:1px solid var(--gold-4); border-radius:2px;
  background:rgba(201,169,97,.045);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  max-width:200px;
}
.auth-btn{
  font-family:var(--font-kai); font-size:13px; letter-spacing:.16em;
  color:var(--gold-2);
  background:linear-gradient(180deg,#4b3b1a,#332816);
  border:1px solid var(--gold-3); border-radius:2px;
  padding:6px 16px; cursor:pointer; transition:.18s;
}
.auth-btn:hover{
  background:linear-gradient(180deg,#5d4920,#3e3018);
  box-shadow:0 0 20px rgba(201,169,97,.32), inset 0 0 16px rgba(201,169,97,.12);
}
.auth-btn.ghost{
  background:transparent; color:var(--paper-2);
  border-color:var(--ink-5);
}
.auth-btn.ghost:hover{
  color:var(--gold-2); border-color:var(--gold-4);
  background:rgba(201,169,97,.08);
}

/* ============================================================
   主体
   ============================================================ */
.grid{
  position:relative; z-index:1; flex:1; min-height:0;
  display:grid; grid-template-columns:252px 1fr 336px;
  padding:15px; gap:15px;
}
.col{
  position:relative; display:flex; flex-direction:column; min-height:0;
  background:linear-gradient(180deg,var(--ink-2),var(--ink-1));
  border:1px solid var(--gold-4); border-radius:3px;
  box-shadow:
    0 0 0 1px rgba(0,0,0,.55),
    inset 0 0 46px rgba(0,0,0,.4),
    0 10px 32px rgba(0,0,0,.45);
  overflow:hidden;
}
.col::before,.col::after{
  content:''; position:absolute; width:13px; height:13px;
  border:1px solid var(--gold-3); opacity:.55; pointer-events:none; z-index:3;
}
.col::before{top:5px; left:5px; border-right:none; border-bottom:none}
.col::after{bottom:5px; right:5px; border-left:none; border-top:none}
.col-head{
  flex:none; height:42px; display:flex; align-items:center; justify-content:space-between;
  padding:0 18px; border-bottom:1px solid var(--gold-4);
  background:linear-gradient(180deg,rgba(201,169,97,.07),transparent);
}
.col-head .t{
  font-family:var(--font-kai); font-size:13.5px; letter-spacing:.24em;
  color:var(--gold); text-shadow:0 0 12px rgba(201,169,97,.25);
}
.col-head .n{
  font-size:11px; color:var(--paper-3); letter-spacing:.1em;
  font-family:var(--font-kai);
}
.col-body{flex:1; overflow-y:auto; padding:9px; min-height:0}

/* 用户列表（多选） */
.user-item{
  display:flex; align-items:center; gap:10px;
  padding:9px 10px; cursor:pointer; border-radius:2px;
  border-left:2px solid transparent; transition:.18s;
  user-select:none;
}
.user-item:hover{background:rgba(201,169,97,.055)}
.user-item.active{
  background:linear-gradient(90deg,rgba(201,169,97,.14),transparent 90%);
  border-left-color:var(--gold);
}
.user-item .check{
  width:16px; height:16px; flex:none;
  border:1px solid var(--gold-4); border-radius:2px;
  display:grid; place-items:center;
  font-size:11px; color:transparent;
  transition:.18s;
}
.user-item.active .check{
  background:var(--gold-3);
  color:var(--ink-0);
  border-color:var(--gold);
}
.user-item .avatar{
  width:29px; height:29px; flex:none; display:grid; place-items:center;
  background:linear-gradient(140deg,var(--cinnabar),#5e1a17);
  color:#f2e6d2; font-family:var(--font-kai); font-size:15px; line-height:1;
  border-radius:2px; padding-bottom:2px;
  box-shadow:inset 0 0 0 1px rgba(201,169,97,.35);
}
.user-item .name{
  flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  font-size:13.5px; letter-spacing:.03em;
}
.user-item .tag{
  font-size:10px; font-family:var(--font-kai); letter-spacing:.12em;
  color:var(--gold-3); border:1px solid var(--gold-4);
  padding:0 5px; border-radius:2px; line-height:1.6;
}
.empty{
  padding:26px 12px; text-align:center; font-size:12px;
  color:var(--paper-3); font-family:var(--font-kai); letter-spacing:.16em;
}

/* ============================================================
   视频网格舞台
   ============================================================ */
.stage{
  flex:1; min-height:0; position:relative;
  background:radial-gradient(ellipse at center,#15110d,#070504 78%);
  overflow:hidden;
}
.stage-grid{
  position:absolute; inset:0;
  display:grid; gap:8px; padding:8px;
  grid-template-columns:repeat(auto-fit, minmax(240px, 1fr));
  grid-auto-rows:1fr;
  align-content:stretch;
}
.stage-grid:empty{display:none}

.tile{
  position:relative; overflow:hidden; min-height:120px;
  border-radius:3px; background:#000;
  border:1px solid var(--gold-4);
  box-shadow:0 0 0 1px rgba(0,0,0,.6), 0 6px 20px rgba(0,0,0,.5);
}
.tile video{
  width:100%; height:100%; object-fit:cover; display:block;
}
.tile.self video{transform:scaleX(-1)}
.tile.sharing video{object-fit:contain; transform:none}
.tile .tile-label{
  position:absolute; left:8px; bottom:8px;
  padding:2px 9px;
  font-family:var(--font-kai); font-size:12px; letter-spacing:.12em;
  color:var(--paper);
  background:rgba(0,0,0,.55);
  border:1px solid var(--gold-4); border-radius:2px;
  backdrop-filter:blur(3px);
  max-width:60%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.tile .tile-state{
  position:absolute; right:8px; top:8px;
  padding:2px 7px;
  font-size:10px; font-family:var(--font-kai);
  letter-spacing:.1em;
  color:var(--paper-3);
  background:rgba(0,0,0,.5);
  border-radius:2px;
}
.tile .tile-state.ok{color:var(--ok)}
.tile .tile-state.bad{color:var(--err)}

.hint{
  position:absolute; inset:0;
  display:flex; flex-direction:column; justify-content:center; align-items:center;
  text-align:center; padding:26px;
  color:var(--paper-3); font-size:12.5px; line-height:2.4; letter-spacing:.14em;
  font-family:var(--font-kai);
  pointer-events:none;
}
.hint b{
  display:block; font-family:var(--font-kai); font-size:20px; font-weight:400;
  color:var(--gold); letter-spacing:.42em; margin-bottom:16px;
  text-shadow:0 0 24px rgba(201,169,97,.4);
}
.hint .hr{
  width:64px; height:1px; margin:0 auto 16px;
  background:linear-gradient(90deg,transparent,var(--gold-3),transparent);
}

/* 控制条 */
.controls{
  flex:none; display:flex; gap:9px; justify-content:center; flex-wrap:wrap;
  padding:14px; border-top:1px solid var(--gold-4);
  background:linear-gradient(180deg,transparent,rgba(0,0,0,.4));
}
button{
  font-family:var(--font-kai); font-size:13.5px; letter-spacing:.14em;
  color:var(--paper); background:linear-gradient(180deg,var(--ink-4),var(--ink-3));
  border:1px solid var(--gold-4); border-radius:2px;
  padding:8px 16px; cursor:pointer; transition:.18s; position:relative;
  white-space:nowrap;
}
button:hover:not(:disabled){
  color:var(--gold-2); border-color:var(--gold-3);
  background:linear-gradient(180deg,#2f2820,var(--ink-4));
  box-shadow:0 0 14px rgba(201,169,97,.22), inset 0 0 14px rgba(201,169,97,.07);
}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.3; cursor:not-allowed}
button.primary{
  background:linear-gradient(180deg,#4b3b1a,#332816);
  border-color:var(--gold-3); color:var(--gold-2);
}
button.primary:hover:not(:disabled){
  background:linear-gradient(180deg,#5d4920,#3e3018);
  box-shadow:0 0 20px rgba(201,169,97,.32), inset 0 0 16px rgba(201,169,97,.12);
}
button.danger{
  background:linear-gradient(180deg,#4b1a16,#331210);
  border-color:#6e2420; color:#e8b2aa;
}
button.danger:hover:not(:disabled){
  background:linear-gradient(180deg,#5f211c,#3e1512);
  border-color:var(--cinnabar-2);
  box-shadow:0 0 18px rgba(193,57,43,.34);
}
button.sm{padding:6px 12px; font-size:12.5px; letter-spacing:.1em}
button.active{
  background:linear-gradient(180deg,#5d4920,#3e3018);
  color:var(--gold-2); border-color:var(--gold-2);
  box-shadow:0 0 18px rgba(201,169,97,.35), inset 0 0 16px rgba(201,169,97,.15);
}

/* ============================================================
   消息区
   ============================================================ */
.log{
  flex:1; min-height:0; overflow-y:auto; padding:14px;
  display:flex; flex-direction:column; gap:10px;
}
.msg{
  max-width:88%; padding:8px 13px; font-size:13.5px; line-height:1.78;
  word-break:break-word; border-radius:2px; position:relative;
}
.msg.me{
  align-self:flex-end;
  background:linear-gradient(180deg,#3b2f19,#2a2112);
  border:1px solid var(--gold-4); color:var(--gold-2);
  box-shadow:0 0 14px rgba(201,169,97,.08);
}
.msg.you{
  align-self:flex-start;
  background:linear-gradient(180deg,var(--ink-3),var(--ink-2));
  border:1px solid var(--ink-5);
}
.msg.you .who{
  display:block; font-size:11px; color:var(--gold-3);
  font-family:var(--font-kai); letter-spacing:.1em; margin-bottom:3px;
}
.msg.sys{
  align-self:center; background:transparent; border:none;
  color:var(--paper-3); font-size:11.5px; letter-spacing:.14em;
  padding:3px 0; font-family:var(--font-kai);
}
.msg.sys::before{content:'— '}
.msg.sys::after{content:' —'}

.file-card{
  align-self:stretch; padding:11px 14px; border-radius:2px;
  background:linear-gradient(180deg,var(--ink-3),var(--ink-2));
  border:1px solid var(--gold-4); border-left:2px solid var(--gold-3);
  font-size:12.5px; position:relative;
}
.file-card .row{display:flex; justify-content:space-between; gap:10px; align-items:center}
.file-card .name{
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  font-family:var(--font-kai); font-size:13.5px; letter-spacing:.06em;
}
.file-card .meta{color:var(--paper-3); font-size:11px; margin-top:3px; letter-spacing:.08em}
.file-card a{color:var(--gold); text-decoration:none; border-bottom:1px dotted var(--gold-3)}
.file-card a:hover{color:var(--gold-2)}
.bar{
  height:3px; background:var(--ink-5); margin-top:9px;
  overflow:hidden; border-radius:1px;
}
.bar i{
  display:block; height:100%; width:0;
  background:linear-gradient(90deg,var(--gold-4),var(--gold),var(--gold-2));
  transition:width .2s; box-shadow:0 0 9px rgba(201,169,97,.6);
}

.composer{
  flex:none; display:flex; gap:8px; padding:12px;
  border-top:1px solid var(--gold-4);
  background:linear-gradient(180deg,transparent,rgba(0,0,0,.34));
}
.composer input[type=text]{
  flex:1; min-width:0; font-family:var(--font-serif); font-size:13.5px;
  color:var(--paper); background:var(--ink-1);
  border:1px solid var(--gold-4); border-radius:2px;
  padding:8px 12px; outline:none; transition:.18s; letter-spacing:.04em;
}
.composer input[type=text]:focus{
  border-color:var(--gold-3);
  box-shadow:0 0 0 1px rgba(201,169,97,.15), inset 0 0 12px rgba(201,169,97,.05);
}
.composer input[type=text]::placeholder{color:var(--paper-3); letter-spacing:.1em}

/* ============================================================
   弹窗
   ============================================================ */
.mask{
  position:fixed; inset:0; z-index:100; padding:20px;
  display:none; place-items:center;
  background:rgba(5,4,3,.8); backdrop-filter:blur(6px);
}
.mask.show{display:grid; animation:fadeIn .22s ease}
@keyframes fadeIn{from{opacity:0}}
.dialog{
  width:min(370px,100%); padding:30px 28px 24px; text-align:center;
  background:linear-gradient(180deg,var(--ink-2),var(--ink-1));
  border:1px solid var(--gold-3); border-radius:3px; position:relative;
  box-shadow:
    0 0 0 1px rgba(0,0,0,.65),
    0 0 70px rgba(201,169,97,.09),
    0 34px 90px rgba(0,0,0,.85);
}
.dialog::before,.dialog::after{
  content:''; position:absolute; width:17px; height:17px;
  border:1px solid var(--gold-3); opacity:.7;
}
.dialog::before{top:7px; left:7px; border-right:none; border-bottom:none}
.dialog::after{bottom:7px; right:7px; border-left:none; border-top:none}
.dialog h3{
  font-family:var(--font-kai); font-size:19px; font-weight:400;
  letter-spacing:.24em; color:var(--gold-2); margin-bottom:11px;
  text-shadow:0 0 18px rgba(201,169,97,.35);
}
.dialog p{color:var(--paper-2); font-size:13px; margin-bottom:24px; letter-spacing:.08em}
.dialog .actions{display:flex; gap:12px; justify-content:center}

.login-dialog{
  width:min(400px,100%);
  padding:36px 32px 28px;
  text-align:left;
}
.login-dialog h3{text-align:center; margin-bottom:26px; font-size:20px}
.login-dialog .field{margin-bottom:18px}
.login-dialog .field label{
  display:block; font-family:var(--font-kai);
  font-size:12px; letter-spacing:.18em;
  color:var(--paper-3); margin-bottom:7px;
}
.login-dialog .field input{
  width:100%; font-family:var(--font-serif); font-size:14px;
  color:var(--paper); background:var(--ink-1);
  border:1px solid var(--gold-4); border-radius:2px;
  padding:10px 13px; outline:none; transition:.18s;
  letter-spacing:.04em;
}
.login-dialog .field input:focus{
  border-color:var(--gold-3);
  box-shadow:0 0 0 1px rgba(201,169,97,.18),
             inset 0 0 14px rgba(201,169,97,.06);
}
.login-dialog .field input::placeholder{color:var(--paper-3); letter-spacing:.1em}
.login-dialog .submit-row{margin-top:24px; display:flex; gap:12px}
.login-dialog .submit-row button{
  flex:1; padding:10px 0; font-size:14px; letter-spacing:.32em;
}
.login-dialog .tip{
  text-align:center; margin-top:20px; margin-bottom:0;
  font-size:12px; color:var(--paper-3);
  font-family:var(--font-kai); letter-spacing:.14em;
}
.login-dialog .close-btn{
  position:absolute; top:12px; right:14px;
  width:28px; height:28px; padding:0;
  font-size:20px; line-height:1; color:var(--paper-3);
  background:transparent; border:none; cursor:pointer;
  border-radius:2px; transition:.18s;
  font-family:var(--font-serif);
}
.login-dialog .close-btn:hover{
  color:var(--gold-2); background:rgba(201,169,97,.1);
}

/* ============================================================
   浮言
   ============================================================ */
#toasts{
  position:fixed; top:84px; left:50%; transform:translateX(-50%);
  z-index:300; display:flex; flex-direction:column; gap:9px;
  align-items:center; pointer-events:none;
}
.toast{
  padding:9px 22px; border-radius:2px; font-size:13px;
  font-family:var(--font-kai); letter-spacing:.14em; color:var(--gold-2);
  background:linear-gradient(180deg,var(--ink-3),var(--ink-2));
  border:1px solid var(--gold-3);
  box-shadow:0 10px 34px rgba(0,0,0,.75), 0 0 22px rgba(201,169,97,.12);
  animation:toastIn .26s ease;
}
.toast.error{
  color:#e8b2aa; border-color:var(--cinnabar);
  box-shadow:0 10px 34px rgba(0,0,0,.75), 0 0 22px rgba(158,43,37,.28);
}
.toast.success{
  color:var(--gold-2); border-color:var(--gold-3);
}
.toast.info{
  color:var(--paper-2); border-color:var(--ink-5);
}
@keyframes toastIn{from{opacity:0; transform:translateY(-12px)}}

/* ============================================================
   小屏
   ============================================================ */
@media(max-width:920px){
  .grid{
    grid-template-columns:1fr; grid-template-rows:auto minmax(220px,1fr) auto;
    padding:10px; gap:10px;
  }
  .col.users .col-body{max-height:120px}
  .col.chat .log{max-height:160px}
  .topbar{height:58px; padding:0 12px; gap:9px}
  .brand h1{font-size:17px; letter-spacing:.16em}
  .brand .tagline{display:none}
  .seal-badge{width:34px; height:34px; font-size:20px}
  .status-pill .txt{display:none}
  .status-pill{padding:5px 9px}
  .user-pill{font-size:12px; padding:4px 10px; max-width:120px}
  .auth-btn{padding:5px 11px; font-size:12px; letter-spacing:.1em}
  button{padding:7px 12px; font-size:12.5px; letter-spacing:.1em}
  .stage-grid{grid-template-columns:1fr; grid-template-rows:auto}
}
</style>
</head>
<body>

<!-- ══════════ 顶栏 ══════════ -->
<header class="topbar">
  <div class="seal-badge">墨</div>
  <div class="brand">
    <h1>墨韵 · 连线</h1>
    <div class="tagline">一纸相连 · 音书万里</div>
  </div>
  <div class="spacer"></div>
  <div class="status-pill">
    <i class="dot" id="dot"></i><span class="txt" id="statusText">未连接</span>
  </div>
  <div class="user-pill" id="meText">未登录 · 游客</div>
  <button class="auth-btn" id="loginBtn">登 录</button>
  <button class="auth-btn ghost" id="logoutBtn" style="display:none;">登 出</button>
</header>

<!-- ══════════ 主体 ══════════ -->
<main class="grid">

  <!-- 左：在线用户（多选） -->
  <section class="col users">
    <div class="col-head">
      <span class="t">在 线 用 户</span>
      <span class="n" id="onlineCount">0</span>
    </div>
    <div class="col-body" id="userList">
      <div class="empty">请先登录 · 方见同道</div>
    </div>
  </section>

  <!-- 中：视频网格 -->
  <section class="col stage-col">
    <div class="stage" id="stage">
      <div class="stage-grid" id="stageGrid"></div>
      <div class="hint" id="stageHint">
        <b>择 友 而 谈</b>
        <div class="hr"></div>
        点击左侧用户可多选<br>
        发起视频 · 语音 · 传书
      </div>
    </div>
    <div class="controls" id="controls">
      <button class="primary" id="btnVideo" disabled>视频</button>
      <button class="primary" id="btnAudio" disabled>语音</button>
      <button id="btnData" disabled>传书</button>
      <button id="btnScreen" disabled>共享屏</button>
      <button id="btnMute" disabled>静音</button>
      <button class="danger" id="btnHangup" disabled>挂断</button>
    </div>
  </section>

  <!-- 右：消息与文件 -->
  <section class="col chat">
    <div class="col-head">
      <span class="t">消 息 与 文 书</span>
      <span class="n" id="peerLabel">—</span>
    </div>
    <div class="log" id="log"></div>
    <div class="composer">
      <input type="text" id="chatInput" placeholder="书 一 言 …" disabled>
      <button class="sm" id="btnSend" disabled>送</button>
      <button class="sm" id="btnPick" disabled>文书</button>
      <input type="file" id="fileInput" hidden multiple>
    </div>
  </section>

</main>

<!-- ══════════ 来电 ══════════ -->
<div class="mask" id="incomingMask">
  <div class="dialog">
    <h3>有 客 来 电</h3>
    <p id="incomingDesc">对方邀请你通话</p>
    <div class="actions">
      <button class="danger" id="btnReject">辞 谢</button>
      <button class="primary" id="btnAccept">应 邀</button>
    </div>
  </div>
</div>

<!-- ══════════ 收书 ══════════ -->
<div class="mask" id="fileMask">
  <div class="dialog">
    <h3>有 书 相 赠</h3>
    <p id="fileDesc">对方想发送文件给你</p>
    <div class="actions">
      <button class="danger" id="btnFileReject">辞 谢</button>
      <button class="primary" id="btnFileAccept">收 下</button>
    </div>
  </div>
</div>

<!-- ══════════ 登录 ══════════ -->
<div class="mask" id="loginMask">
  <div class="dialog login-dialog">
    <button class="close-btn" id="btnCloseLogin" aria-label="关闭">×</button>
    <h3>登 录 书 斋</h3>
    <div class="field">
      <label for="loginUser">账 号</label>
      <input type="text" id="loginUser" placeholder="请输入账号" autocomplete="username" spellcheck="false">
    </div>
    <div class="field">
      <label for="loginPass">密 码</label>
      <input type="password" id="loginPass" placeholder="请输入密码" autocomplete="current-password">
    </div>
    <div class="submit-row">
      <button class="primary" id="btnSubmitLogin">登 录</button>
    </div>
    <p class="tip">游客可浏览 · 登录后可通话传书</p>
  </div>
</div>

<div id="toasts"></div>

<script>
/* ============================================================
   配置
   ============================================================ */
const API_BASE = 'https://myzlm.serveousercontent.com';
const WS_URL   = 'wss://myzlm.serveousercontent.com/ws/rtc';

const CHUNK_SIZE   = 16 * 1024;
const HIGH_WATER   = 4 * 1024 * 1024;
const LOW_WATER    = 1024 * 1024;
const MAX_MESH     = 4;   // 最大 Mesh 参与人数（含自己）

/* 视频采集参数：默认 480p，比 720p 省一半带宽 */
const VIDEO_CONSTRAINTS = {
  width:  { ideal: 640, max: 1280 },
  height: { ideal: 480, max: 720 },
  frameRate: { ideal: 20, max: 30 }
};

/* 音频采集参数 */
const AUDIO_CONSTRAINTS = {
  echoCancellation: true,
  noiseSuppression: true,
  autoGainControl: true,
  sampleRate: 48000,
  channelCount: 1
};

/* ============================================================
   状态
   ============================================================ */
let csrf = '';
let ws = null;
let me = null;
let iceServers = [{ urls: ['stun:stun.l.google.com:19302'] }];
let onlineUsers = [];
let selectedPeers = new Set();
let groupCall = null;   // { id, host, peers:Set, invited:Set, media, localStream, connections:Map, screenStream, screenTrack, originalVideoTrack }
let reconnectTimer = null;
let sendQueue = [];
let sending = false;
let rxFile = null;
let pendingIncoming = null;
let pendingFileOffer = null;
let connecting = false;
let renegotiating = false;

const $ = id => document.getElementById(id);
const rand = () => (crypto.randomUUID ? crypto.randomUUID()
  : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
      const r = Math.random() * 16 | 0;
      return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
    }));

/* ============================================================
   工具
   ============================================================ */
function toast(text, type = 'info', ms = 2600) {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = text;
  $('toasts').appendChild(el);
  setTimeout(() => el.remove(), ms);
}
function fmtSize(n) {
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
  if (n < 1073741824) return (n / 1048576).toFixed(1) + ' MB';
  return (n / 1073741824).toFixed(2) + ' GB';
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => (
    { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]
  ));
}
function setStatus(text, ok) {
  $('statusText').textContent = text;
  $('dot').classList.toggle('on', !!ok);
}
function roleText(r) {
  return ({ owner: '主人', admin: '管事', member: '同门' })[r] || r;
}
/* 用户名比较：字典序小的主动发起 offer，避免双方同时 offer */
function shouldIOffer(a, b) {
  return a < b;
}

/* ============================================================
   统一请求封装
   ============================================================ */
async function api(path, opts = {}) {
  const method = (opts.method || 'GET').toUpperCase();
  const headers = Object.assign({}, opts.headers || {});
  const isWrite = !['GET', 'HEAD', 'OPTIONS'].includes(method);

  if (isWrite) {
    if (csrf) headers['X-CSRF-Token'] = csrf;
    if (opts.body && typeof opts.body === 'string'
        && !headers['Content-Type']) {
      headers['Content-Type'] = 'application/json';
    }
  }

  const cfg = Object.assign({}, opts, {
    method,
    headers,
    credentials: 'include',
    mode: 'cors'
  });

  const res = await fetch(API_BASE + path, cfg);

  let data = null;
  try { data = await res.json(); } catch (_) {}

  if (!res.ok) {
    if (isWrite && res.status === 403 && data
        && typeof data.error === 'string'
        && data.error.indexOf('CSRF') !== -1) {
      try { await fetchCsrf(); } catch (_) {}
      headers['X-CSRF-Token'] = csrf;
      const retry = await fetch(API_BASE + path,
        Object.assign({}, cfg, { headers }));
      let d2 = null;
      try { d2 = await retry.json(); } catch (_) {}
      if (retry.ok) return d2;
      throw new Error((d2 && d2.error) || ('请求失败 ' + retry.status));
    }
    throw new Error((data && data.error) || ('请求失败 ' + res.status));
  }
  return data;
}

async function fetchCsrf() {
  const res = await fetch(API_BASE + '/api/csrf', {
    credentials: 'include',
    mode: 'cors'
  });
  if (!res.ok) return;
  const data = await res.json().catch(() => null);
  if (data && data.csrfToken) csrf = data.csrfToken;
}

/* ============================================================
   消息区
   ============================================================ */
function logNode(text, cls, who = null) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  if (who) {
    const w = document.createElement('span');
    w.className = 'who';
    w.textContent = who;
    d.appendChild(w);
    d.appendChild(document.createTextNode(text));
  } else {
    d.textContent = text;
  }
  $('log').appendChild(d);
  $('log').scrollTop = $('log').scrollHeight;
  return d;
}
function sysLog(text) { logNode(text, 'sys'); }

/* ============================================================
   登录模块
   ============================================================ */
function updateLoginUI(loggedIn) {
  const loginBtn = $('loginBtn');
  const logoutBtn = $('logoutBtn');
  const meText = $('meText');

  if (loggedIn && me) {
    meText.textContent = me.username + ' · ' + roleText(me.role);
    loginBtn.style.display = 'none';
    logoutBtn.style.display = 'inline-block';
  } else {
    meText.textContent = '未登录 · 游客';
    loginBtn.style.display = 'inline-block';
    logoutBtn.style.display = 'none';
  }
}

function openLoginModal() {
  $('loginUser').value = '';
  $('loginPass').value = '';
  $('loginMask').classList.add('show');
  setTimeout(() => { $('loginUser').focus(); }, 120);
}
function closeLoginModal() {
  $('loginMask').classList.remove('show');
}

async function submitLogin() {
  const username = $('loginUser').value.trim();
  const password = $('loginPass').value;

  if (!username || !password) {
    toast('请输入账号和密码', 'error');
    return;
  }

  const btn = $('btnSubmitLogin');
  btn.disabled = true;
  btn.textContent = '登 录 中';

  try {
    const data = await api('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });

    me = {
      username: data.username,
      role: data.role,
      mustChangePassword: !!data.mustChangePassword
    };
    csrf = data.csrfToken || '';

    updateLoginUI(true);
    closeLoginModal();
    toast('欢迎回来，' + data.username, 'success');

    await connect();
  } catch (e) {
    toast(e.message || '登录失败', 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = '登 录';
  }
}

async function doLogout() {
  try {
    await api('/api/logout', { method: 'POST' });
  } catch (_) {}

  me = null;
  csrf = '';
  updateLoginUI(false);

  if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
  if (ws) { try { ws.close(); } catch (_) {} ws = null; }
  cleanupGroupCall();

  onlineUsers = [];
  selectedPeers.clear();
  renderUsers();
  $('peerLabel').textContent = '—';
  $('log').innerHTML = '';
  setStatus('未连接', false);
  toast('已登出', 'info');
}

/* ============================================================
   WebSocket
   ============================================================ */
async function connect() {
  if (!me) return;
  if (connecting) return;
  if (ws && ws.readyState === 1) return;

  connecting = true;
  setStatus('连接中', false);

  try {
    const t = await api('/api/rtc/ticket', { method: 'POST' });
    if (t && Array.isArray(t.iceServers) && t.iceServers.length) {
      iceServers = t.iceServers;
    }
    openWS(t.token);
  } catch (e) {
    setStatus('凭证失败', false);
    if (reconnectTimer) clearTimeout(reconnectTimer);
    reconnectTimer = setTimeout(() => { connecting = false; connect(); }, 5000);
  } finally {
    setTimeout(() => { connecting = false; }, 800);
  }
}

function openWS(ticket) {
  try { if (ws) ws.close(); } catch (_) {}
  ws = new WebSocket(WS_URL + '?ticket=' + encodeURIComponent(ticket));

  ws.onopen = () => setStatus('已 通', true);

  ws.onmessage = ev => {
    let msg;
    try { msg = JSON.parse(ev.data); } catch (_) { return; }
    handleSignal(msg);
  };

  ws.onclose = () => {
    setStatus('已 断', false);
    cleanupGroupCall(true);
    if (me) {
      if (reconnectTimer) clearTimeout(reconnectTimer);
      reconnectTimer = setTimeout(() => { connect(); }, 3000);
    }
  };

  ws.onerror = () => {};
}

function send(obj) {
  if (ws && ws.readyState === 1) {
    try { ws.send(JSON.stringify(obj)); return true; } catch (_) {}
  }
  return false;
}

/* ============================================================
   信令分发
   ============================================================ */
function handleSignal(msg) {
  switch (msg.type) {
    case 'ready':
      if (Array.isArray(msg.iceServers) && msg.iceServers.length) {
        iceServers = msg.iceServers;
      }
      break;

    case 'presence':
      onlineUsers = (msg.users || []).filter(u => u !== (me && me.username));
      // 清理已离线的选中项
      for (const p of [...selectedPeers]) {
        if (onlineUsers.indexOf(p) === -1) selectedPeers.delete(p);
      }
      renderUsers();
      updateButtons();
      break;

    case 'peer:offline':
      toast('对方已离线');
      if (groupCall && groupCall.peers.has(msg.to)) {
        closePeer(msg.to);
        groupCall.peers.delete(msg.to);
        renderVideoGrid();
        updateButtons();
      }
      break;

    case 'error':
      toast(msg.error || '服务端异常', 'error');
      break;

    case 'call:invite':   onIncoming(msg); break;
    case 'call:accept':   onAccepted(msg); break;
    case 'call:members':  onMembers(msg); break;
    case 'call:reject':   onRejected(msg); break;
    case 'call:leave':    onLeave(msg); break;

    case 'rtc:offer':  onRemoteOffer(msg); break;
    case 'rtc:answer': onRemoteAnswer(msg); break;
    case 'rtc:ice':    onRemoteIce(msg); break;
  }
}

/* ============================================================
   用户列表（多选）
   ============================================================ */
function renderUsers() {
  const box = $('userList');
  $('onlineCount').textContent = onlineUsers.length;

  if (!me) {
    box.innerHTML = '<div class="empty">请先登录 · 方见同道</div>';
    return;
  }
  if (!onlineUsers.length) {
    box.innerHTML = '<div class="empty">暂无同门在线</div>';
    return;
  }
  box.innerHTML = '';
  for (const u of onlineUsers) {
    const active = selectedPeers.has(u);
    const el = document.createElement('div');
    el.className = 'user-item' + (active ? ' active' : '');
    el.dataset.username = u;
    el.innerHTML =
      '<div class="check">✓</div>' +
      '<div class="avatar">' + escapeHtml(u.slice(0, 1).toUpperCase()) + '</div>' +
      '<div class="name">' + escapeHtml(u) + '</div>' +
      '<div class="tag">在线</div>';
    el.onclick = () => togglePeer(u);
    el.ondblclick = () => {
      selectedPeers.clear();
      selectedPeers.add(u);
      renderUsers();
      updateButtons();
      startCall('video');
    };
    box.appendChild(el);
  }
}

function togglePeer(u) {
  if (!me) {
    toast('请先登录', 'error');
    openLoginModal();
    return;
  }
  if (groupCall) {
    toast('通话中不可更改选择', 'info');
    return;
  }
  if (selectedPeers.has(u)) {
    selectedPeers.delete(u);
  } else {
    if (selectedPeers.size >= MAX_MESH - 1) {
      return toast('最多同时连线 ' + (MAX_MESH - 1) + ' 人', 'info');
    }
    selectedPeers.add(u);
  }
  renderUsers();
  updateButtons();
}

function updateButtons() {
  const busy = !!groupCall;
  const active = groupCall && groupCall.peers.size > 0;
  const hasSel = selectedPeers.size > 0;
  const loggedIn = !!me;
  const onePeer = active && groupCall.peers.size === 1;

  $('btnVideo').disabled  = busy || !hasSel || !loggedIn;
  $('btnAudio').disabled  = busy || !hasSel || !loggedIn;
  $('btnData').disabled   = busy || !hasSel || !loggedIn || selectedPeers.size > 1;
  $('btnHangup').disabled = !busy;
  $('btnMute').disabled   = !active;
  $('btnScreen').disabled = !active;
  $('btnSend').disabled   = !active;
  // 文件传输仅 1v1 可用
  $('btnPick').disabled   = !onePeer;
  $('chatInput').disabled = !active;
}

/* ============================================================
   群组通话管理
   ============================================================ */

/* ---- 发起方 ---- */
async function startCall(media) {
  if (!me) { toast('请先登录', 'error'); openLoginModal(); return; }
  if (groupCall) return toast('已有通话进行中', 'info');
  if (selectedPeers.size === 0) return toast('请先选择用户', 'info');

  if (media === 'data' && selectedPeers.size > 1) {
    return toast('传书仅支持单对单', 'info');
  }

  let stream = null;
  try {
    if (media !== 'data') {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: AUDIO_CONSTRAINTS,
        video: media === 'video' ? VIDEO_CONSTRAINTS : false
      });
      // 提示编码器优先保流畅
      if (stream.getVideoTracks()[0]) {
        stream.getVideoTracks()[0].contentHint = 'motion';
      }
    }
  } catch (e) {
    return toast('无法取用设备：' + e.message, 'error');
  }

  const callId = rand();
  const invited = new Set(selectedPeers);

  groupCall = {
    id: callId,
    host: me.username,
    peers: new Set(),
    invited,
    media,
    localStream: stream,
    connections: new Map(),
    screenStream: null,
    screenTrack: null,
    originalVideoTrack: null
  };

  renderVideoGrid();
  updateButtons();

  // 逐个发送邀请
  for (const peer of invited) {
    send({
      type: 'call:invite',
      to: peer,
      callId,
      media,
      from: me.username
    });
  }
  sysLog('正在呼叫 ' + invited.size + ' 位同道');
}

/* ---- 被邀请方 ---- */
function onIncoming(msg) {
  if (groupCall) {
    send({ type: 'call:reject', to: msg.from, callId: msg.callId, reason: 'busy' });
    return;
  }
  pendingIncoming = msg;
  const label = { video: '视频通话', audio: '语音通话', data: '传书' }[msg.media] || '通话';
  $('incomingDesc').textContent = msg.from + ' 邀请你 · ' + label;
  $('incomingMask').classList.add('show');
}

$('btnReject').onclick = () => {
  if (pendingIncoming) {
    send({
      type: 'call:reject',
      to: pendingIncoming.from,
      callId: pendingIncoming.callId,
      reason: 'declined'
    });
    pendingIncoming = null;
  }
  $('incomingMask').classList.remove('show');
};

$('btnAccept').onclick = async () => {
  const inv = pendingIncoming;
  pendingIncoming = null;
  $('incomingMask').classList.remove('show');
  if (!inv) return;

  let stream = null;
  try {
    if (inv.media !== 'data') {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: AUDIO_CONSTRAINTS,
        video: inv.media === 'video' ? VIDEO_CONSTRAINTS : false
      });
      if (stream.getVideoTracks()[0]) {
        stream.getVideoTracks()[0].contentHint = 'motion';
      }
    }
  } catch (e) {
    send({ type: 'call:reject', to: inv.from, callId: inv.callId, reason: 'no-device' });
    return toast('无法取用设备：' + e.message, 'error');
  }

  groupCall = {
    id: inv.callId,
    host: inv.from,
    peers: new Set([inv.from]),   // 立刻把发起者加入 peers
    invited: new Set(),
    media: inv.media,
    localStream: stream,
    connections: new Map(),
    screenStream: null,
    screenTrack: null,
    originalVideoTrack: null
  };

  renderVideoGrid();
  updateButtons();

  send({ type: 'call:accept', to: inv.from, callId: inv.callId, from: me.username });
  sysLog('已应邀 ' + inv.from);

  // 与被邀请者按规则建立连接
  if (shouldIOffer(me.username, inv.from)) {
    ensurePeerConnection(inv.from, true);
  } else {
    ensurePeerConnection(inv.from, false);
  }
};

/* ---- 发起方收到 accept ---- */
function onAccepted(msg) {
  if (!groupCall || msg.callId !== groupCall.id) return;
  const peer = msg.from;

  groupCall.invited.delete(peer);
  if (!groupCall.peers.has(peer)) {
    groupCall.peers.add(peer);
  }

  // 广播最新成员列表给所有已加入的成员
  broadcastMembers();

  renderVideoGrid();
  updateButtons();

  // 与新成员建立连接
  if (shouldIOffer(me.username, peer)) {
    ensurePeerConnection(peer, true);
  } else {
    ensurePeerConnection(peer, false);
  }
}

/* ---- 广播成员列表 ---- */
function broadcastMembers() {
  if (!groupCall) return;
  const members = [me.username, ...groupCall.peers];
  for (const peer of groupCall.peers) {
    send({
      type: 'call:members',
      to: peer,
      callId: groupCall.id,
      members
    });
  }
}

/* ---- 收到成员列表更新 ---- */
function onMembers(msg) {
  if (!groupCall || msg.callId !== groupCall.id) return;
  const members = Array.isArray(msg.members) ? msg.members : [];

  const newPeers = new Set(
    members.filter(u => u && u !== me.username && u !== groupCall.host
      && onlineUsers.concat([groupCall.host]).indexOf(u) !== -1)
  );
  // host 本身就已在 peers 里（或者被邀请方已有）
  if (groupCall.host !== me.username && members.indexOf(groupCall.host) !== -1) {
    newPeers.add(groupCall.host);
  }

  // 移除已离场
  for (const old of [...groupCall.peers]) {
    if (!newPeers.has(old)) {
      closePeer(old);
      groupCall.peers.delete(old);
    }
  }

  // 加入新成员
  const added = [];
  for (const p of newPeers) {
    if (!groupCall.peers.has(p)) {
      groupCall.peers.add(p);
      added.push(p);
    }
  }

  renderVideoGrid();
  updateButtons();

  // 按规则建连
  for (const p of added) {
    if (shouldIOffer(me.username, p)) {
      ensurePeerConnection(p, true);
    } else {
      ensurePeerConnection(p, false);
    }
  }
}

/* ---- 被拒 ---- */
function onRejected(msg) {
  if (!groupCall || msg.callId !== groupCall.id) return;
  const peer = msg.from;
  if (groupCall.invited.has(peer)) {
    groupCall.invited.delete(peer);
    sysLog(peer + ' 辞谢了邀请');
  }
  // 全部被拒 → 结束
  if (groupCall.invited.size === 0 && groupCall.peers.size === 0
      && groupCall.host === me.username) {
    toast('通话无人应邀', 'info');
    cleanupGroupCall();
  }
  updateButtons();
}

/* ---- 有人离开 ---- */
function onLeave(msg) {
  if (!groupCall || msg.callId !== groupCall.id) return;
  const peer = msg.from;
  if (groupCall.peers.has(peer)) {
    closePeer(peer);
    groupCall.peers.delete(peer);
    sysLog(peer + ' 已离席');
    renderVideoGrid();
    updateButtons();
  }
}

/* ============================================================
   PeerConnection 管理
   ============================================================ */
function ensurePeerConnection(peer, isInitiator) {
  if (!groupCall) return null;
  if (groupCall.connections.has(peer)) {
    const existing = groupCall.connections.get(peer);
    // 如果原来不是发起方，但现在需要发起，重新协商
    if (isInitiator && !existing.isInitiator) {
      renegotiateWith(peer);
    }
    return existing;
  }

  const pc = new RTCPeerConnection({
    iceServers,
    iceCandidatePoolSize: 6,
    bundlePolicy: 'max-bundle',
    rtcpMuxPolicy: 'require'
  });

  const conn = {
    peer,
    pc,
    remoteStream: new MediaStream(),
    dcCtrl: null,
    dcFile: null,
    pendingIce: [],
    state: 'connecting',
    isInitiator
  };
  groupCall.connections.set(peer, conn);

  // 添加本地轨道
  if (groupCall.localStream) {
    for (const track of groupCall.localStream.getTracks()) {
      const sender = pc.addTrack(track, groupCall.localStream);
      if (track.kind === 'video') tuneVideoSender(sender);
    }
  }

  // 数据通道：发起方创建
  if (isInitiator) {
    const ctrl = pc.createDataChannel('ctrl', { ordered: true });
    const file = pc.createDataChannel('file', { ordered: true });
    bindCtrl(ctrl, peer);
    bindFile(file, peer);
    conn.dcCtrl = ctrl;
    conn.dcFile = file;
  } else {
    pc.ondatachannel = ev => {
      const ch = ev.channel;
      if (ch.label === 'ctrl') { conn.dcCtrl = ch; bindCtrl(ch, peer); }
      else if (ch.label === 'file') { conn.dcFile = ch; bindFile(ch, peer); }
    };
  }

  pc.onicecandidate = ev => {
    if (ev.candidate && groupCall) {
      send({
        type: 'rtc:ice', to: peer, callId: groupCall.id,
        candidate: ev.candidate
      });
    }
  };

  pc.ontrack = ev => {
    conn.remoteStream.addTrack(ev.track);
    updatePeerVideo(peer, conn.remoteStream);
    tryPlayAllVideos();
  };

  pc.onconnectionstatechange = () => {
    const st = pc.connectionState;
    conn.state = st;
    if (st === 'connected') {
      updateTileState(peer, '已通', 'ok');
    } else if (st === 'failed' || st === 'closed') {
      updateTileState(peer, '中断', 'bad');
    } else if (st === 'disconnected') {
      updateTileState(peer, '不稳', 'bad');
    }
  };

  // 发起协商
  if (isInitiator) {
    (async () => {
      try {
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        send({
          type: 'rtc:offer', to: peer, callId: groupCall.id,
          sdp: pc.localDescription
        });
      } catch (e) {
        console.error('[createOffer]', e);
      }
    })();
  }

  return conn;
}

function closePeer(peer) {
  if (!groupCall) return;
  const conn = groupCall.connections.get(peer);
  if (!conn) return;

  try { conn.pc.close(); } catch (_) {}
  if (conn.dcCtrl) try { conn.dcCtrl.close(); } catch (_) {}
  if (conn.dcFile) try { conn.dcFile.close(); } catch (_) {}

  groupCall.connections.delete(peer);
  const tile = document.querySelector('.tile[data-peer="' + CSS.escape(peer) + '"]');
  if (tile) tile.remove();
}

async function onRemoteOffer(msg) {
  if (!groupCall || msg.callId !== groupCall.id) return;
  const peer = msg.from;
  const conn = ensurePeerConnection(peer, false);
  if (!conn) return;

  try {
    if (conn.pc.signalingState === 'have-local-offer') {
      try { await conn.pc.setLocalDescription({ type: 'rollback' }); } catch (_) {}
    }
    await conn.pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
    for (const c of conn.pendingIce) {
      try { await conn.pc.addIceCandidate(c); } catch (_) {}
    }
    conn.pendingIce = [];

    const answer = await conn.pc.createAnswer();
    await conn.pc.setLocalDescription(answer);
    send({
      type: 'rtc:answer', to: peer, callId: groupCall.id,
      sdp: conn.pc.localDescription
    });
  } catch (e) {
    console.error('[onRemoteOffer]', e);
  }
}

async function onRemoteAnswer(msg) {
  if (!groupCall || msg.callId !== groupCall.id) return;
  const conn = groupCall.connections.get(msg.from);
  if (!conn) return;
  try {
    await conn.pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
    for (const c of conn.pendingIce) {
      try { await conn.pc.addIceCandidate(c); } catch (_) {}
    }
    conn.pendingIce = [];
  } catch (e) {
    console.error('[onRemoteAnswer]', e);
  }
}

async function onRemoteIce(msg) {
  if (!groupCall || msg.callId !== groupCall.id) return;
  const conn = groupCall.connections.get(msg.from);
  if (!conn) return;
  const cand = msg.candidate;
  if (!cand) return;
  if (conn.pc.remoteDescription && conn.pc.remoteDescription.type) {
    try { await conn.pc.addIceCandidate(cand); } catch (_) {}
  } else {
    conn.pendingIce.push(cand);
  }
}

/* ---- 与指定 peer 重新协商 ---- */
async function renegotiateWith(peer) {
  if (!groupCall) return;
  const conn = groupCall.connections.get(peer);
  if (!conn || !conn.pc) return;
  try {
    if (conn.pc.signalingState === 'have-local-offer') {
      try { await conn.pc.setLocalDescription({ type: 'rollback' }); } catch (_) {}
    }
    const offer = await conn.pc.createOffer();
    await conn.pc.setLocalDescription(offer);
    send({
      type: 'rtc:offer', to: peer, callId: groupCall.id,
      sdp: conn.pc.localDescription
    });
  } catch (e) {
    console.error('[renegotiateWith]', e);
  }
}

/* ---- 与所有 peer 重新协商（用于屏幕共享等）---- */
async function renegotiateAll() {
  if (!groupCall) return;
  for (const [peer, conn] of groupCall.connections) {
    if (conn.state === 'connected') {
      await renegotiateWith(peer);
    }
  }
}

/* ============================================================
   SDP / 发送参数优化
   ============================================================ */
function tuneVideoSender(sender) {
  try {
    const params = sender.getParameters();
    if (!params.encodings || !params.encodings.length) {
      params.encodings = [{}];
    }
    // 根据当前连接数动态调整码率
    const n = groupCall ? Math.max(1, groupCall.peers.size) : 1;
    let maxBitrate = 800_000;
    let maxFramerate = 24;
    if (n === 2) { maxBitrate = 500_000; maxFramerate = 24; }
    else if (n === 3) { maxBitrate = 400_000; maxFramerate = 20; }
    else if (n >= 4) { maxBitrate = 300_000; maxFramerate = 20; }

    params.encodings[0].maxBitrate = maxBitrate;
    params.encodings[0].maxFramerate = maxFramerate;
    params.degradationPreference = 'balanced';
    try { params.encodings[0].networkPriority = 'high'; } catch (_) {}
    return sender.setParameters(params);
  } catch (e) {
    console.warn('[tuneVideoSender]', e);
  }
}

/* ============================================================
   视频网格渲染
   ============================================================ */
function renderVideoGrid() {
  const grid = $('stageGrid');
  const hint = $('stageHint');

  if (!groupCall) {
    grid.innerHTML = '';
    hint.style.display = 'flex';
    return;
  }
  hint.style.display = 'none';

  // 自己的 tile
  let selfTile = grid.querySelector('.tile.self');
  if (!selfTile) {
    selfTile = document.createElement('div');
    selfTile.className = 'tile self';
    selfTile.innerHTML =
      '<video autoplay playsinline muted></video>' +
      '<div class="tile-label">我</div>';
    grid.insertBefore(selfTile, grid.firstChild);
  }
  const selfVideo = selfTile.querySelector('video');
  if (selfVideo.srcObject !== groupCall.localStream) {
    selfVideo.srcObject = groupCall.localStream;
    selfVideo.play().catch(() => {});
  }
  const hasVideo = groupCall.localStream
    && groupCall.localStream.getVideoTracks().length > 0;
  selfTile.style.display = hasVideo ? '' : 'none';

  // 每个 peer 的 tile
  for (const peer of groupCall.peers) {
    let tile = grid.querySelector('.tile[data-peer="' + CSS.escape(peer) + '"]');
    if (!tile) {
      tile = document.createElement('div');
      tile.className = 'tile';
      tile.dataset.peer = peer;
      tile.innerHTML =
        '<video autoplay playsinline></video>' +
        '<div class="tile-label">' + escapeHtml(peer) + '</div>' +
        '<div class="tile-state">连接中</div>';
      grid.appendChild(tile);
    }
  }

  // 移除多余
  for (const tile of [...grid.querySelectorAll('.tile[data-peer]')]) {
    const peer = tile.dataset.peer;
    if (!groupCall.peers.has(peer)) tile.remove();
  }

  tryPlayAllVideos();
}

function updatePeerVideo(peer, stream) {
  const tile = document.querySelector('.tile[data-peer="' + CSS.escape(peer) + '"]');
  if (!tile) return;
  const v = tile.querySelector('video');
  if (v.srcObject !== stream) {
    v.srcObject = stream;
    v.play().catch(() => {});
  }
}

function updateTileState(peer, text, cls = '') {
  const tile = document.querySelector('.tile[data-peer="' + CSS.escape(peer) + '"]');
  if (!tile) return;
  const st = tile.querySelector('.tile-state');
  if (st) {
    st.textContent = text;
    st.className = 'tile-state ' + cls;
  }
}

function tryPlayAllVideos() {
  document.querySelectorAll('.tile video').forEach(v => {
    if (v.srcObject && v.paused) {
      v.play().catch(() => {});
    }
  });
}

/* ============================================================
   数据通道
   ============================================================ */
function bindCtrl(ch, peer) {
  ch.onopen = () => {
    updateButtons();
  };
  ch.onclose = () => {
    if (groupCall && groupCall.state === 'connected') {
      sysLog('与 ' + peer + ' 的文路已闭');
    }
  };
  ch.onmessage = ev => {
    if (typeof ev.data !== 'string') return;
    let m;
    try { m = JSON.parse(ev.data); } catch (_) { return; }

    if (m.type === 'chat') {
      logNode(m.text, 'you', peer);
    } else if (m.type === 'file-offer') {
      pendingFileOffer = m;
      pendingFileOffer.from = peer;
      $('fileDesc').textContent =
        peer + ' 想赠：' + m.name + '（' + fmtSize(m.size) + '）';
      $('fileMask').classList.add('show');
    } else if (m.type === 'file-accept') {
      const item = sendQueue.find(x => x.id === m.id);
      if (item) item.accepted = true;
      pumpQueue();
    } else if (m.type === 'file-reject') {
      sendQueue = sendQueue.filter(x => x.id !== m.id);
      sysLog(peer + ' 辞谢文书：' + (m.name || ''));
      pumpQueue();
    }
  };
}

function bindFile(ch, peer) {
  ch.binaryType = 'arraybuffer';
  ch.bufferedAmountLowThreshold = LOW_WATER;

  ch.onmessage = ev => {
    if (typeof ev.data === 'string') {
      let m;
      try { m = JSON.parse(ev.data); } catch (_) { return; }
      if (m.t === 'meta') {
        rxFile = {
          id: m.id, name: m.name, size: m.size, mime: m.mime,
          chunks: [], got: 0, node: null, bar: null, from: peer
        };
        const node = document.createElement('div');
        node.className = 'file-card';
        node.innerHTML =
          '<div class="row"><div class="name">' +
          escapeHtml(m.name) + '</div>' +
          '<div style="color:var(--paper-3)">接收中</div></div>' +
          '<div class="meta">来自 ' + escapeHtml(peer) + ' · ' +
          fmtSize(m.size) + '</div>' +
          '<div class="bar"><i></i></div>';
        $('log').appendChild(node);
        $('log').scrollTop = $('log').scrollHeight;
        rxFile.node = node;
        rxFile.bar = node.querySelector('.bar i');
      } else if (m.t === 'end') {
        finalizeReceive();
      }
      return;
    }
    if (rxFile && ev.data instanceof ArrayBuffer) {
      rxFile.chunks.push(ev.data);
      rxFile.got += ev.data.byteLength;
      if (rxFile.bar) {
        rxFile.bar.style.width =
          Math.min(100, rxFile.got / rxFile.size * 100) + '%';
      }
      if (rxFile.got >= rxFile.size) finalizeReceive();
    }
  };
}

function finalizeReceive() {
  if (!rxFile) return;
  const f = rxFile;
  rxFile = null;
  const blob = new Blob(f.chunks, { type: f.mime || 'application/octet-stream' });
  const url = URL.createObjectURL(blob);
  if (f.node) {
    f.node.querySelector('.row').lastElementChild.textContent = '已收';
    f.node.querySelector('.bar i').style.width = '100%';
    const a = document.createElement('a');
    a.href = url;
    a.download = f.name;
    a.textContent = '存 取 文 书';
    a.style.cssText =
      'display:inline-block;margin-top:9px;font-family:var(--font-kai);letter-spacing:.14em';
    f.node.appendChild(a);
  }
  sysLog('文书已收：' + f.name);
}

/* ============================================================
   文件发送（仅 1v1）
   ============================================================ */
$('btnPick').onclick = () => $('fileInput').click();
$('fileInput').onchange = e => {
  for (const f of e.target.files) enqueueFile(f);
  e.target.value = '';
};

function getOnlyPeerConn() {
  if (!groupCall || groupCall.peers.size !== 1) return null;
  const peer = [...groupCall.peers][0];
  const conn = groupCall.connections.get(peer);
  return conn ? { peer, conn } : null;
}

function enqueueFile(file) {
  const pair = getOnlyPeerConn();
  if (!pair || !pair.conn.dcCtrl || pair.conn.dcCtrl.readyState !== 'open') {
    return toast('文路未通', 'error');
  }
  const id = rand();
  sendQueue.push({ id, file, accepted: false, peer: pair.peer });
  try {
    pair.conn.dcCtrl.send(JSON.stringify({
      type: 'file-offer', id,
      name: file.name, size: file.size,
      mime: file.type || 'application/octet-stream'
    }));
  } catch (_) {}
  sysLog('已发文书之请：' + file.name);
}

async function pumpQueue() {
  if (sending) return;
  const idx = sendQueue.findIndex(x => x.accepted);
  if (idx === -1) return;
  sending = true;
  const item = sendQueue[idx];

  const node = document.createElement('div');
  node.className = 'file-card';
  node.innerHTML =
    '<div class="row"><div class="name">' + escapeHtml(item.file.name) + '</div>' +
    '<div style="color:var(--paper-3)">发送中</div></div>' +
    '<div class="meta">' + fmtSize(item.file.size) + '</div>' +
    '<div class="bar"><i></i></div>';
  $('log').appendChild(node);
  $('log').scrollTop = $('log').scrollHeight;
  const bar = node.querySelector('.bar i');

  try {
    await transferFile(item, bar);
    node.querySelector('.row').lastElementChild.textContent = '已发';
  } catch (e) {
    node.querySelector('.row').lastElementChild.textContent = '失败';
    toast('文书发送失败：' + e.message, 'error');
  }

  sendQueue = sendQueue.filter(x => x.id !== item.id);
  sending = false;
  if (sendQueue.some(x => x.accepted)) pumpQueue();
}

async function transferFile(item, bar) {
  const conn = groupCall && groupCall.connections.get(item.peer);
  if (!conn || !conn.dcFile || conn.dcFile.readyState !== 'open') {
    throw new Error('文路未启');
  }
  const dc = conn.dcFile;
  const file = item.file;
  dc.send(JSON.stringify({
    t: 'meta', id: item.id, name: file.name,
    size: file.size, mime: file.type || 'application/octet-stream'
  }));

  let offset = 0;
  while (offset < file.size) {
    if (dc.readyState !== 'open') throw new Error('文路已闭');
    if (dc.bufferedAmount > HIGH_WATER) {
      await new Promise(res => {
        const on = () => { dc.removeEventListener('bufferedamountlow', on); res(); };
        dc.addEventListener('bufferedamountlow', on);
        setTimeout(() => {
          dc.removeEventListener('bufferedamountlow', on);
          res();
        }, 3000);
      });
    }
    const slice = file.slice(offset, offset + CHUNK_SIZE);
    const buf = await slice.arrayBuffer();
    dc.send(buf);
    offset += buf.byteLength;
    if (bar) bar.style.width = Math.min(100, offset / file.size * 100) + '%';
  }
  dc.send(JSON.stringify({ t: 'end', id: item.id }));
}

/* ============================================================
   文字聊天（广播）
   ============================================================ */
$('btnSend').onclick = sendChat;
$('chatInput').onkeydown = e => { if (e.key === 'Enter') sendChat(); };

function sendChat() {
  if (!groupCall) return;
  const input = $('chatInput');
  const text = input.value.trim();
  if (!text) return;

  let sent = false;
  for (const [, conn] of groupCall.connections) {
    if (conn.dcCtrl && conn.dcCtrl.readyState === 'open') {
      try {
        conn.dcCtrl.send(JSON.stringify({ type: 'chat', text }));
        sent = true;
      } catch (_) {}
    }
  }
  if (!sent) return toast('文路未通', 'error');
  logNode(text, 'me');
  input.value = '';
}

/* ---- 屏幕共享 ---- */
$('btnScreen').onclick = async () => {
  if (!groupCall || groupCall.peers.size === 0) return;

  if (groupCall.screenStream) {
    await stopScreenShare();
    return;
  }

  if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
    return toast('当前浏览器不支持屏幕共享', 'error');
  }

  let stream;
  try {
    stream = await navigator.mediaDevices.getDisplayMedia({
      video: { frameRate: { ideal: 15, max: 30 } },
      audio: false
    });
  } catch (e) {
    if (e && e.name === 'NotAllowedError') {
      return toast('已取消共享', 'info');
    }
    return toast('共享失败：' + (e && e.message), 'error');
  }

  const screenTrack = stream.getVideoTracks()[0];
  if (!screenTrack) {
    stream.getTracks().forEach(t => t.stop());
    return toast('未获取到屏幕视频', 'error');
  }
  screenTrack.contentHint = 'detail';

  groupCall.screenStream = stream;

  try {
    let needRenegotiate = false;
    for (const [, conn] of groupCall.connections) {
      const sender = conn.pc.getSenders().find(
        s => s.track && s.track.kind === 'video');
      if (sender) {
        // 已有视频轨 → 直接替换
        await sender.replaceTrack(screenTrack);
        // 提升码率以保证屏幕清晰
        try {
          const p = sender.getParameters();
          if (!p.encodings || !p.encodings.length) p.encodings = [{}];
          p.encodings[0].maxBitrate = 1_500_000;
          p.encodings[0].maxFramerate = 15;
          p.degradationPreference = 'maintain-resolution';
          await sender.setParameters(p);
        } catch (_) {}
      } else {
        // 语音通话 → 添加轨道并重新协商
        conn.pc.addTrack(screenTrack, stream);
        needRenegotiate = true;
      }
    }
    if (needRenegotiate) {
      await renegotiateAll();
    }

    groupCall.screenTrack = screenTrack;

    // 本地预览显示屏幕
    const selfTile = document.querySelector('.tile.self');
    if (selfTile) {
      selfTile.classList.add('sharing');
      const v = selfTile.querySelector('video');
      v.srcObject = stream;
      v.play().catch(() => {});
    }

    screenTrack.onended = () => { stopScreenShare(); };

    $('btnScreen').textContent = '止共享';
    $('btnScreen').classList.add('active');
    toast('屏幕共享已开始', 'success');
  } catch (e) {
    stream.getTracks().forEach(t => t.stop());
    groupCall.screenStream = null;
    toast('共享失败：' + (e && e.message), 'error');
  }
};

async function stopScreenShare() {
  if (!groupCall) return;

  if (groupCall.screenStream) {
    try { groupCall.screenStream.getTracks().forEach(t => t.stop()); } catch (_) {}
    groupCall.screenStream = null;
  }

  if (groupCall.screenTrack) {
    const cameraTrack = groupCall.localStream
      ? groupCall.localStream.getVideoTracks()[0]
      : null;

    let needRenegotiate = false;
    for (const [, conn] of groupCall.connections) {
      const sender = conn.pc.getSenders().find(
        s => s.track && s.track.kind === 'video');
      if (sender) {
        if (cameraTrack) {
          try { await sender.replaceTrack(cameraTrack); } catch (_) {}
          // 恢复普通码率
          tuneVideoSender(sender);
        } else {
          try { conn.pc.removeTrack(sender); } catch (_) {}
          needRenegotiate = true;
        }
      }
    }
    if (needRenegotiate) {
      await renegotiateAll();
    }
    groupCall.screenTrack = null;
  }

  // 恢复本地预览
  const selfTile = document.querySelector('.tile.self');
  if (selfTile) {
    selfTile.classList.remove('sharing');
    const v = selfTile.querySelector('video');
    if (groupCall.localStream && groupCall.localStream.getVideoTracks().length) {
      v.srcObject = groupCall.localStream;
      v.play().catch(() => {});
      selfTile.style.display = '';
    } else {
      selfTile.style.display = 'none';
    }
  }

  $('btnScreen').textContent = '共享屏';
  $('btnScreen').classList.remove('active');
  toast('已停止共享', 'info');
}

/* ---- 挂断 ---- */
$('btnHangup').onclick = () => {
  if (!groupCall) return;
  // 通知所有人
  for (const peer of groupCall.peers) {
    send({ type: 'call:leave', to: peer, callId: groupCall.id, from: me.username });
  }
  // 未接通的邀请也取消
  for (const peer of groupCall.invited) {
    send({ type: 'call:reject', to: peer, callId: groupCall.id, reason: 'cancelled' });
  }
  cleanupGroupCall();
};

function cleanupGroupCall(notify = false) {
  if (!groupCall) return;

  if (notify) {
    for (const peer of groupCall.peers) {
      try {
        send({ type: 'call:leave', to: peer, callId: groupCall.id, from: me.username });
      } catch (_) {}
    }
  }

  for (const peer of [...groupCall.connections.keys()]) {
    closePeer(peer);
  }

  if (groupCall.localStream) {
    groupCall.localStream.getTracks().forEach(t => t.stop());
  }
  if (groupCall.screenStream) {
    groupCall.screenStream.getTracks().forEach(t => t.stop());
  }
  if (groupCall.screenTrack) {
    try { groupCall.screenTrack.stop(); } catch (_) {}
  }

  groupCall = null;
  sendQueue = [];
  sending = false;
  rxFile = null;
  renegotiating = false;

  $('stageGrid').innerHTML = '';
  $('stageHint').style.display = 'flex';
  $('btnScreen').textContent = '共享屏';
  $('btnScreen').classList.remove('active');
  $('btnMute').textContent = '静音';
  $('btnMute').classList.remove('active');
  $('incomingMask').classList.remove('show');
  $('fileMask').classList.remove('show');
  $('peerLabel').textContent = selectedPeers.size
    ? [...selectedPeers].join(' · ')
    : '—';
  updateButtons();
}

/* ============================================================
   登录事件绑定
   ============================================================ */
function bindLoginEvents() {
  $('loginBtn').addEventListener('click', openLoginModal);
  $('logoutBtn').addEventListener('click', doLogout);
  $('btnCloseLogin').addEventListener('click', closeLoginModal);
  $('btnSubmitLogin').addEventListener('click', submitLogin);

  $('loginPass').addEventListener('keydown', e => {
    if (e.key === 'Enter') submitLogin();
  });
  $('loginUser').addEventListener('keydown', e => {
    if (e.key === 'Enter') $('loginPass').focus();
  });

  $('loginMask').addEventListener('click', e => {
    if (e.target === $('loginMask')) closeLoginModal();
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && $('loginMask').classList.contains('show')) {
      closeLoginModal();
    }
  });
}

/* ============================================================
   启动
   ============================================================ */
async function boot() {
  bindLoginEvents();
  updateLoginUI(false);
  updateButtons();

  try { await fetchCsrf(); } catch (_) {}

  try {
    const data = await api('/api/me');
    if (data && data.username) {
      me = {
        username: data.username,
        role: data.role,
        mustChangePassword: !!data.mustChangePassword
      };
      csrf = data.csrfToken || csrf;
      updateLoginUI(true);
      await connect();
    } else {
      me = null;
      updateLoginUI(false);
      setStatus('未登录', false);
    }
  } catch (_) {
    me = null;
    updateLoginUI(false);
    setStatus('未连接', false);
  }
}

window.addEventListener('beforeunload', () => {
  if (groupCall) {
    for (const peer of groupCall.peers) {
      try {
        send({ type: 'call:leave', to: peer, callId: groupCall.id, from: me.username });
      } catch (_) {}
    }
  }
});

boot();
</script>
